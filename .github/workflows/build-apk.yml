name: Build KnowledgeFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js / Web check
        run: echo "Checking project files..."

      - name: Build Web Bundle Zip
        run: |
          mkdir -p dist
          cp index.html dist/ 2>/dev/null || true
          cp -r *.json dist/ 2>/dev/null || true
          zip -r knowledgeflow-web.zip index.html *.json 2>/dev/null || true

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledgeflow-web-package
          path: knowledgeflow-web.zip
